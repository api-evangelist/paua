aid: paua
name: Paua
description: >-
  Paua is a UK business EV charging platform that consolidates public, home, and
  workplace electric-vehicle charging into a single EV charge card, driver app,
  and fleet dashboard, with one monthly invoice across the UK's 95,000+ charging
  connectors. Paua offers products including Paua Access, Paua Reimburse, Paua
  Share, Paua PRO, and Salary Sacrifice charging, and exposes partner and Paua
  Pro APIs for fleet charging data (charging history, costs, energy, timestamps)
  and chargepoint location data. API access is not public - it is provided to
  partners and Paua Pro customers after a technical discussion. Paua is backed by
  Seedcamp and Speedinvest.
